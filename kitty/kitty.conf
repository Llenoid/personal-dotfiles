#: Fonts {{{

adjust_line_height 90%

#: Font size (in pts)
font_size 13
map ctrl+i ctrl+i
cursor_shape block

#: Window layout {{{

remember_window_size  no
initial_window_width  1800
initial_window_height 960

window_border_width 1pt

draw_minimal_borders yes

window_margin_width 0

single_window_margin_width 1

window_padding_width 18 18 0 18

placement_strategy center
# active_border_color #ff8758
# inactive_border_color #cccccc

hide_window_decorations yes

confirm_os_window_close 0

#: Tab bar {{{

tab_bar_edge top

tab_bar_margin_width 0.0

tab_bar_margin_height 0.0 0.0

tab_bar_style powerline

#: custom
#:     A user-supplied Python function called draw_tab is loaded from the file
#:     tab_bar.py in the kitty config directory. For examples of how to
#:     write such a function, see the functions named draw_tab_with_* in
#:     kitty's source code: kitty/tab_bar.py. See also
#:     this discussion <https://github.com/kovidgoyal/kitty/discussions/4447>
#:     for examples from kitty users.

tab_separator "🭵"

tab_powerline_style slanted

tab_title_template "{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{sup.index}{title.split('/')[-1]}"
# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index}{title}"

active_tab_font_style   bold-italic
inactive_tab_font_style normal

#: Color scheme {{{

# background_opacity 0.95
background_opacity 1
background_blur 0

background_tint 0.0

#: The 256 terminal colors. There are 8 basic colors, each color has a
#: dull and bright version, for the first 16 colors. You can set the
#: remaining 240 colors as color16 to color255.

# color0 #000000
# color8 #767676

#: black

# color1 #cc0403
# color9 #f2201f

#: red

# color2  #19cb00
# color10 #23fd00

#: green

# color3  #cecb00
# color11 #fffd00

#: yellow

# color4  #0d73cc
# color12 #1a8fff

#: blue

# color5  #cb1ed1
# color13 #fd28ff

#: magenta

# color6  #0dcdcd
# color14 #14ffff

#: cyan

# color7  #dddddd
# color15 #ffffff

#: white

update_check_interval 0

linux_display_server wayland

#: Keyboard shortcuts {{{

map ctrl+shift+1 first_window
map ctrl+shift+2 second_window
map ctrl+shift+3 third_window
map ctrl+shift+4 fourth_window
map ctrl+shift+5 fifth_window
map ctrl+shift+6 sixth_window
map ctrl+shift+7 seventh_window
map ctrl+shift+8 eighth_window
map ctrl+shift+9 ninth_window
map ctrl+shift+0 tenth_window

# zoom window
map ctrl+f zoom_toggle.py

#: Tab management {{{

map ctrl+tab        next_tab
map ctrl+shift+tab previous_tab

#: New tab

# map kitty_mod+t new_tab
# map cmd+t       new_tab
# map kitty_mod+t new_tab
# map ctrl+shift+t   new_tab_with_cwd
# map ctrl+shift+t launch --cwd=current --type=tab
map ctrl+shift+t launch --type=tab --cwd=oldest --location after
# map ctrl+t launch --cwd=current --type=tab

#: Move cursor per word
map ctrl+left send_text all \x1b\x62 
map ctrl+right send_text all \x1b\x66 

#: Close tab

#: Close OS window

# map shift+cmd+w close_os_window

# map ctrl+\ launch --cwd=current nvim .
map alt+\ launch --location=vsplit --cwd=current
# map ctrl+- launch --location=hsplit --cwd=current nvim .
map alt+- launch --location=hsplit --cwd=current

map alt+shift+t launch --location=hsplit --cwd=current

map ctrl+shift+w close_window

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map alt+shift+enter new_window

# map alt+h neighboring_window left
# map alt+j neighboring_window bottom
# map alt+k neighboring_window top
# map alt+l neighboring_window right

# map alt+shift+h move_window left
# map alt+shift+j move_window bottom
# map alt+shift+k move_window top
# map alt+shift+l move_window right

map ctrl+shift+left resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up resize_window taller
map ctrl+shift+down resize_window shorter
# reset all windows in the tab to default sizes
map ctrl+home resize_window reset


map ctrl+shift+] change_font_size all +2.0
map ctrl+shift+[ change_font_size all -2.0

# For using <C-S-j/k> in neovim
# https://www.reddit.com/r/neovim/comments/mbj8m5/how_to_setup_ctrlshiftkey_mappings_in_neovim_and/
map ctrl+shift+j send_text all \x1b[74;5u
map ctrl+shift+k send_text all \x1b[75;5u
map ctrl+shift+\ send_text all \x1b[92;5u
map ctrl+shift+- send_text all \x1b[45;5u

map ctrl+shift+, load_config_file /home/brandon/.config/kitty/kitty.conf

cursor_trail 0
cursor_trail_decay 0.05 0.08
cursor_trail_start_threshold 1
term xterm-256color
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
scrollback_lines 50000
scrollback_indicator_opacity 1.0
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
modify_font underline_position 2
modify_font underline_thickness 150%
modify_font strikethrough_position 2px
modify_font cell_width 100%
modify_font cell_height -1px
modify_font baseline 1

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

tab_bar_align left
# BEGIN_KITTY_THEME
# GitHub Dark Dimmed
include current-theme.conf
# END_KITTY_THEME
# cursor none
# cursor #ffffff
dynamic_background_opacity yes
# cursor #ff8758
cursor #ffd3bd
# cursor #ff9e75
# cursor #ffc4a8
# cursor_text_color #444
cursor_shape beam 
cursor_beam_thickness 2.0
cursor_underline_thickness 2.0
cursor_blink_interval 1 ease-in-out
cursor_stop_blinking_after 15
macos_option_as_alt no
text_composition_strategy legacy
# text_composition_strategy 0.5 20
# text_composition_strategy platform
# sync_to_monitor yes
input_delay 0
repaint_delay 0
sync_to_monitor no
forward_remote_control yes

# - Use additional nerd symbols
# See https://github.com/be5invis/Iosevka/issues/248
# See https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points
# Seti-UI + Custom
# symbol_map U+E5FA-U+E62B Symbols Nerd Font
# # Devicons
# symbol_map U+E700-U+E7C5 Symbols Nerd Font
# # Font Awesome
# symbol_map U+F000-U+F2E0 Symbols Nerd Font
# # Font Awesome Extension
# symbol_map U+E200-U+E2A9 Symbols Nerd Font
# # Material Design Icons
# symbol_map U+F500-U+FD46 Symbols Nerd Font
# # Weather
# symbol_map U+E300-U+E3EB Symbols Nerd Font
# # Octicons
# symbol_map U+F400-U+F4A8,U+2665,U+26A1,U+F27C Symbols Nerd Font
# # Powerline Extra Symbols
# symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CC-U+E0D2,U+E0D4 Symbols Nerd Font
# # IEC Power Symbols
# symbol_map U+23FB-U+23FE,U+2b58 Symbols Nerd Font
# # Font Logos
# symbol_map U+F300-U+F313 Symbols Nerd Font
# # Pomicons
# symbol_map U+E000-U+E00D Symbols Nerd Font
# 
# symbol_map U+f101-U+f208 nonicon

map alt+shift+j send_text all \x1b[74;2u
map alt+shift+k send_text all \x1b[75;2u
map alt+shift+h send_text all \x1b[73;2u
map alt+shift+l send_text all \x1b[77;2u

# map ctrl+; kitten toggle_term.py
# map ctrl+; kitten toggle_terminal.py
enabled_layouts splits,stack
map ctrl+; kitten focus_mode.py
# map ctrl+; toggle_layout stack
# map ctrl+shift+space kitten hints --customize-processing hint.py
# smart-split
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+h neighboring_window left
map alt+l neighboring_window right

# Unset the mapping to pass the keys to neovim
# map --when-focus-on var:IS_NVIM ctrl+j
# map --when-focus-on var:IS_NVIM ctrl+k
# map --when-focus-on var:IS_NVIM ctrl+h
# map --when-focus-on var:IS_NVIM ctrl+l

# the 3 here is the resize amount, adjust as needed
map alt+shift+j kitten relative_resize.py down  2
map alt+shift+k kitten relative_resize.py up    2
map alt+shift+h kitten relative_resize.py left  2
map alt+shift+l kitten relative_resize.py right 2

# map --when-focus-on var:IS_NVIM alt+j
# map --when-focus-on var:IS_NVIM alt+k
# map --when-focus-on var:IS_NVIM alt+h
# map --when-focus-on var:IS_NVIM alt+l

map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
map ctrl+d no_op

# Shell integration
shell_integration enabled

# Dank color generation
# include dank-tabs.conf
# include dank-theme.conf

allow_remote_control yes

# Must match path set in python script for "color_file" variable
# include /home/brandon/.config/kitty/mellifluous.conf
# include /home/brandon/.config/kitty/Tokyo_Night_Moon.conf
# include /home/brandon/.config/kitty/onenord.conf
# include themes/ghostty/config-dankcolors.conf
include themes/catpuccin/themes/mocha.conf

resize_debounce_time 0
